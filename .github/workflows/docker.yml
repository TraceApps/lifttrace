name: Build & Push

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU lets the x86 GHA runner emulate ARM64 instructions during
      # the arm64 build leg. Needed for cross-arch builds without a
      # separate arm64 runner. Covers Raspberry Pi 4 / Pi 5.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Uses a PAT (GHCR_PAT) rather than the auto-provided GITHUB_TOKEN
      # because this package was originally created by pushes from the
      # (now-archived) private lifttrace-dev repo. GitHub's token-permission
      # inheritance model doesn't retroactively grant write access to a
      # repo that inherited the package via "Change linked repository";
      # a PAT with write:packages scope is the community-standard workaround.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only two tags are published, mirrored to both registries:
      #   push to main (or semver tag on main) → :latest
      #   push to dev                          → :dev
      # Same tag set exists at both ghcr.io/traceapps/lifttrace
      # (primary) and traceapps/lifttrace on Docker Hub (mirror).
      #
      # Semver family tags (:1.2.3, :1.2, :1) and per-commit :sha-*
      # tags are intentionally not emitted. Registry stays uncluttered
      # and users pick one of two known-good pins: :latest for stable
      # releases (main), :dev for the leading edge. Historical release
      # artifacts live on the GitHub Releases page (source + signed APK
      # per tag); reproducibility for a specific version uses manifest
      # digests instead of a semver tag.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/traceapps/lifttrace
            traceapps/lifttrace
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
