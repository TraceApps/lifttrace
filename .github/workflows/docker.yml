name: Build & Push to GHCR

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU lets the x86 GHA runner emulate ARM64 instructions during
      # the arm64 build leg. Needed for cross-arch builds without a
      # separate arm64 runner. Covers Raspberry Pi 4 / Pi 5.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Uses a PAT (GHCR_PAT) rather than the auto-provided GITHUB_TOKEN
      # because this package was originally created by pushes from the
      # (now-archived) private lifttrace-dev repo. GitHub's token-permission
      # inheritance model doesn't retroactively grant write access to a
      # repo that inherited the package via "Change linked repository";
      # a PAT with write:packages scope is the community-standard workaround.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # Derive tags from the ref:
      #   semver tag v1.2.3 → :1.2.3, :1.2, :1
      #   push to main      → :latest, :main, :sha-<shortsha>
      #   push to dev       → :dev, :sha-<shortsha>
      # Users pin :dev for the leading edge, :latest for stable
      # releases, or :1.0 for auto-patch within a minor.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/traceapps/lifttrace
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
