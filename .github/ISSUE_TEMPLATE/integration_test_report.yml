name: Integration Test Report
description: Try an import or a music server with your own data and report what worked.
title: '[Integration Test] '
body:
- type: markdown
  attributes:
    value: |
      LiftTrace is tested against a small set of sample exports and music servers, so a report from your real data is extremely valuable. Reports of things that work are just as useful as reports of things that don't.
- type: dropdown
  id: integration
  attributes:
    label: Integration
    options:
    - Import from Strong
    - Import from Hevy
    - Import from FitNotes
    - Import from Jefit
    - Import from Garmin FIT files
    - 'Radio: Subsonic-compatible server (Navidrome, Airsonic, Funkwhale, Gonic)'
    - 'Radio: Jellyfin'
    - 'Radio: Plex'
    - 'Radio: Emby'
    - 'Radio: Internet station (Icecast, Shoutcast, HLS)'
    - Sign-in with an OIDC provider
    - Something else
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: LiftTrace Version
    description: Shown in **Settings > About**.
    placeholder: e.g. v1.2.0
  validations:
    required: true
- type: input
  id: source
  attributes:
    label: Device, App, or Server Version
    placeholder: e.g. Strong 5.1.2 export / Navidrome 0.52 / Authentik 2025.2
  validations:
    required: false
- type: textarea
  id: worked
  attributes:
    label: What Worked
    value: |
      Mark each with a check, a cross, or n/a.

      Imports:
      - Exercise names matched to the library:
      - Weights and units:
      - Reps and RPE:
      - Warm-up sets:
      - Supersets:
      - Workout dates, times, and duration:
      - Notes:

      Radio:
      - Browsing artists, albums, and playlists:
      - Cover art:
      - Playback without gaps:
      - Now playing info:
      - Background playback and lock screen controls on Android:
  validations:
    required: false
- type: textarea
  id: broken
  attributes:
    label: What Didn't Work
    description: Specific entries, wrong values, error messages. Write "Everything worked" if it did.
  validations:
    required: true
- type: textarea
  id: sample
  attributes:
    label: Sample File or Address
    description: A sample export with personal notes removed, or a public stream address, helps reproduce the problem.
  validations:
    required: false
- type: textarea
  id: logs
  attributes:
    label: Logs
    description: |
      **App log:** in LiftTrace, open **Settings > Diagnostics**, turn on **Verbose Diagnostic Logging**, make the problem happen, then open **View Diagnostic Logs** and copy it.

      **Server log:** `docker logs <container name> --tail 200`

      Remove anything private before posting: body weight and other body stats, email addresses, auth tokens, AI API keys, OIDC client secrets, and your server's address.
    render: text
  validations:
    required: false
- type: textarea
  id: screenshots
  attributes:
    label: Screenshots
    description: Drag files into this box.
  validations:
    required: false
