<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0A0B0F" id="theme-color-meta" />
  <title>LiftTrace</title>
  <!-- VitePWA injects its own <link rel="manifest"> with a relative href that
       respects Vite's base config; an absolute one here would resolve to the
       wrong path under BASE_URL. -->
  <!-- Inter is loaded from Google Fonts; falling back to system-ui is fine
       cosmetically and Inter's woff2 only takes a few hundred KB.
       Material Symbols Rounded is bundled locally via @font-face in
       base.css — relying on Google Fonts there caused a FOUT on Android
       cold-launch where the literal icon names ("menu", "fitness_center",
       etc.) flashed as text before the font arrived. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=block" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png?v=dev04" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=dev04" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png?v=dev04" />

  <!-- Disable service worker in Capacitor native mode (assets served natively, SW causes offline.html redirect) -->
  <script>
    (function() {
      // Block SW registration in native Capacitor shell
      if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
          // Override register to no-op so vite-plugin-pwa's registerSW.js does nothing
          navigator.serviceWorker.register = function() { return Promise.resolve(); };
        }
      }

      var _raw = localStorage.getItem('wl_appearance');
      var appearance = _raw ? JSON.parse(_raw) : 'system';
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var dark = appearance === 'dark' || (appearance === 'system' && prefersDark);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      var meta = document.getElementById('theme-color-meta');
      if (meta) meta.content = dark ? '#0A0B0F' : '#F5F7FA';
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
