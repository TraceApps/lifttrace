// LiftTrace on the wrist: the set you are on, logged between sets, with the
// rest timer running where you can see it. A standalone Wear app, so it works
// on Wi-Fi or LTE without the phone nearby; the phone hands over the server
// address and a token once, through the Wearable Data Layer.
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "com.lifttrace.app.wear"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.lifttrace.app"
        // Wear OS 3 and up. Older watches run a different app model entirely.
        minSdkVersion 30
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Its own numbering; the name tracks the phone app it pairs with.
        versionCode 2
        versionName "1.4.0"
    }

    buildFeatures {
        compose true
    }

    // The watch app and the phone app must be signed with the same key, or the
    // Wearable Data Layer silently carries nothing between them (and that is
    // how the watch gets the server address and token).
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def hasReleaseKeystore = keystorePropertiesFile.exists()
    def keystoreProperties = new Properties()
    if (hasReleaseKeystore) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
        release {
            // Smaller and quicker to start on a watch, which has less of
            // everything. The services are kept by name in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2025.09.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.wear.compose:compose-material3:1.5.0"
    implementation "androidx.wear.compose:compose-foundation:1.5.0"
    implementation "androidx.wear.compose:compose-navigation:1.5.0"
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.4"
    implementation "com.google.android.gms:play-services-wearable:19.0.0"
    // A tile: the set you are on, one swipe from the watch face, no app launch.
    implementation "androidx.wear.tiles:tiles:1.5.0"
    implementation "androidx.wear.protolayout:protolayout:1.3.0"
    implementation "androidx.wear.protolayout:protolayout-expression:1.3.0"
    // The rest on the watch face and in the launcher while it counts, without
    // the app open. The system draws the ticking clock, so nothing here wakes
    // up to update it.
    implementation "androidx.wear:wear-ongoing:1.0.0"
    // A complication: sets done, on the watch face itself.
    implementation "androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1"
    implementation "com.google.guava:guava:33.3.1-android"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    // HttpURLConnection can't send PUT with a body reliably on every watch;
    // OkHttp can, and sending the day back is how a set is logged.
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // Applies the bundled startup profile on first run.
    implementation "androidx.profileinstaller:profileinstaller:1.4.1"
    debugImplementation "androidx.compose.ui:ui-tooling"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
